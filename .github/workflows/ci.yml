name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
      - run: npx vite build --mode single && node scripts/inline.mjs dist-single
      - uses: actions/upload-artifact@v4
        with:
          name: if-it-fits-single-html
          path: dist-single/index.html
