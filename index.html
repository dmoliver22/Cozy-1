<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#3E3A4F" />
    <meta name="description" content="A cozy house of squishy cats and three games: If It Fits (nudge cats into teacups, boots and sinks; a new room every morning), Cat Jar and Cat Drop. Cats move in as you play." />
    <title>If It Fits</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- until the page's styles arrive with its script (they come and go with the
         games); :where() keeps these from outranking any stylesheet, wherever
         a host puts them -->
    <style>
      :where(html, body) {
        margin: 0;
        background: #3e3a4f;
      }
      :where(#app) {
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game" aria-label="The room. Drag a cat to nudge it, tap a cat to boop it."></canvas>

      <header id="topbar">
        <button id="homeBtn" class="round-btn hidden" aria-label="Home">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-home" /></svg>
        </button>
        <button id="menuBtn" class="round-btn" aria-label="Menu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14" /></svg>
        </button>
        <div class="title">
          <div id="roomName">If It Fits</div>
          <div id="roomSub"></div>
        </div>
        <div id="faces" class="faces" aria-label="Cats seated"></div>
        <div id="par" class="par" aria-label="Nudges used and par">
          <svg class="paw" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-paw" /></svg>
          <span id="pawCount">0</span><span class="par-sep">/</span><span id="parCount">–</span>
        </div>
      </header>

      <footer id="tray" class="tray">
        <button id="undoBtn" class="tin tin-cream" aria-label="Undo last nudge">
          <span class="tin-lid"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-undo" /></svg></span>
          <span class="tin-label">undo</span>
        </button>
        <button id="hintBtn" class="tin tin-ginger" aria-label="Hint">
          <span class="tin-lid"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-hint" /></svg></span>
          <span class="tin-label">hint</span>
        </button>
        <button id="sandboxBtn" class="tin tin-mint" aria-label="Sandbox photo room">
          <span class="tin-lid"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-sandbox" /></svg></span>
          <span class="tin-label">sandbox</span>
        </button>
      </footer>

      <footer id="sandboxTray" class="tray hidden">
        <button id="sbCatsBtn" class="tin tin-ginger" aria-label="Add a cat">
          <span class="tin-lid"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-cat" /></svg></span>
          <span class="tin-label">cats</span>
        </button>
        <button id="sbPropsBtn" class="tin tin-blue" aria-label="Add a container">
          <span class="tin-lid"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-cup" /></svg></span>
          <span class="tin-label">things</span>
        </button>
        <button id="sbPhotoBtn" class="tin tin-cream" aria-label="Take a photo">
          <span class="tin-lid"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-camera" /></svg></span>
          <span class="tin-label">photo</span>
        </button>
        <button id="sbBackBtn" class="tin tin-mint" aria-label="Back to the room">
          <span class="tin-lid"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-back" /></svg></span>
          <span class="tin-label">back</span>
        </button>
      </footer>

      <footer id="homeBar" class="tray home-bar hidden">
        <button class="tin tin-mint" data-game="fits" aria-label="Play If It Fits">
          <span class="tin-lid"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-box" /></svg><span class="face-badge hidden"></span></span>
          <span class="tin-label">If It Fits</span>
          <span class="tin-note"></span>
        </button>
        <button class="tin tin-blue" data-game="jar" aria-label="Play Cat Jar">
          <span class="tin-lid"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-jar" /></svg><span class="face-badge hidden"></span></span>
          <span class="tin-label">Cat Jar</span>
          <span class="tin-note"></span>
        </button>
        <button class="tin tin-ginger" data-game="drop" aria-label="Play Cat Drop">
          <span class="tin-lid"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-drop" /></svg><span class="face-badge hidden"></span></span>
          <span class="tin-label">Cat Drop</span>
          <span class="tin-note"></span>
        </button>
        <button class="tin tin-cream" data-act="shop" aria-label="Shop">
          <span class="tin-lid"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-shop" /></svg></span>
          <span class="tin-label">Shop</span>
          <span class="tin-note"></span>
        </button>
      </footer>

      <div id="drawer" class="drawer hidden" role="dialog" aria-label="Choose"></div>
      <div id="overlay" class="overlay hidden"></div>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
      <div id="loading" class="loading">
        <div class="loading-cup"></div>
        <div class="loading-text">Tidying today's room…</div>
      </div>
    </div>

    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <symbol id="i-paw" viewBox="0 0 24 24">
          <ellipse cx="12" cy="15.5" rx="5.2" ry="4.3" />
          <ellipse cx="6" cy="10" rx="2" ry="2.5" />
          <ellipse cx="9.6" cy="6.6" rx="2" ry="2.5" />
          <ellipse cx="14.4" cy="6.6" rx="2" ry="2.5" />
          <ellipse cx="18" cy="10" rx="2" ry="2.5" />
        </symbol>
        <symbol id="i-undo" viewBox="0 0 24 24">
          <path d="M9 7 4.5 11.5 9 16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M5 11.5h8.5a5 5 0 0 1 0 10H11" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" />
        </symbol>
        <symbol id="i-hint" viewBox="0 0 24 24">
          <path d="M12 3.5a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3.5Z" fill="currentColor" />
          <rect x="9.5" y="17.6" width="5" height="2.2" rx="1.1" fill="currentColor" />
          <rect x="10.3" y="20.4" width="3.4" height="1.6" rx=".8" fill="currentColor" />
        </symbol>
        <symbol id="i-sandbox" viewBox="0 0 24 24">
          <path d="M5 10h14l-1.6 9.2a2 2 0 0 1-2 1.8H8.6a2 2 0 0 1-2-1.8Z" fill="currentColor" />
          <path d="M8 10a4 4 0 0 1 8 0" fill="none" stroke="currentColor" stroke-width="2.2" />
          <circle cx="17.5" cy="5" r="1.6" fill="currentColor" />
          <circle cx="6.5" cy="5.5" r="1.1" fill="currentColor" />
        </symbol>
        <symbol id="i-cat" viewBox="0 0 24 24">
          <path d="M4.5 9.5 5.5 3.8l4 3.2a9 9 0 0 1 5 0l4-3.2 1 5.7A8 8 0 0 1 21 13c0 4.2-4 7-9 7s-9-2.8-9-7a8 8 0 0 1 1.5-3.5Z" fill="currentColor" />
        </symbol>
        <symbol id="i-cup" viewBox="0 0 24 24">
          <path d="M3.5 8h13l-1.2 8.3A3 3 0 0 1 12.3 19H7.7a3 3 0 0 1-3-2.7Z" fill="currentColor" />
          <path d="M16.3 9.5h1.7a2.6 2.6 0 0 1 0 5.2h-2.3" fill="none" stroke="currentColor" stroke-width="2" />
          <rect x="2" y="19.5" width="16" height="2" rx="1" fill="currentColor" />
        </symbol>
        <symbol id="i-camera" viewBox="0 0 24 24">
          <path d="M4 8h3l1.6-2.4h6.8L17 8h3a1.5 1.5 0 0 1 1.5 1.5v9A1.5 1.5 0 0 1 20 20H4a1.5 1.5 0 0 1-1.5-1.5v-9A1.5 1.5 0 0 1 4 8Z" fill="currentColor" />
          <circle cx="12" cy="13.5" r="3.6" fill="none" stroke="#fff8ee" stroke-width="2" />
        </symbol>
        <symbol id="i-back" viewBox="0 0 24 24">
          <path d="M14.5 5.5 8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
        </symbol>
        <symbol id="i-home" viewBox="0 0 24 24">
          <path d="M3.5 11.2 12 4l8.5 7.2" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M6 10.2V19a1 1 0 0 0 1 1h3.4v-5.2h3.2V20H17a1 1 0 0 0 1-1v-8.8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" />
        </symbol>
        <symbol id="i-box" viewBox="0 0 24 24">
          <path d="M3.6 11h16.8l-1.5 8.6a1.6 1.6 0 0 1-1.6 1.4H6.7a1.6 1.6 0 0 1-1.6-1.4Z" />
          <path d="M3.6 11 1.8 7.4h6.6l2 3.6M20.4 11l1.8-3.6h-6.6l-2 3.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
          <path d="M8.2 11 9 6.4l2.4 2.2a5 5 0 0 1 1.2 0L15 6.4l.8 4.6Z" />
        </symbol>
        <symbol id="i-jar" viewBox="0 0 24 24">
          <rect x="6.6" y="2.6" width="10.8" height="3" rx="1.2" />
          <path d="M7.4 6.6h9.2c1.7 1.2 2.6 2.7 2.6 4.8v7.4a2.4 2.4 0 0 1-2.4 2.4H7.2a2.4 2.4 0 0 1-2.4-2.4v-7.4c0-2.1.9-3.6 2.6-4.8Z" />
          <path d="M8.4 19c0-2.4 1.6-3.8 3.6-3.8s3.6 1.4 3.6 3.8Z" fill="#fff8ee" />
          <path d="M8.9 16.4 9.3 13.6l1.7 1.6M15.1 16.4l-.4-2.8-1.7 1.6" fill="#fff8ee" />
        </symbol>
        <symbol id="i-drop" viewBox="0 0 24 24">
          <path d="M12 3.2v11.6M7 10.6l5 5.2 5-5.2" fill="none" stroke="currentColor" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M2.6 20.4h6.4M15 20.4h6.4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" />
        </symbol>
        <symbol id="i-treat" viewBox="0 0 24 24">
          <path d="M2.8 12c2.6-4.7 9.4-6.1 13.9-2.2L21.2 6.4l-.8 5.6.8 5.6-4.5-3.4c-4.5 3.9-11.3 2.5-13.9-2.2Z" fill="#EDB458" stroke="#A9732A" stroke-width="1.4" stroke-linejoin="round" />
          <path d="M5 11.2q2.2-2.6 5.4-2.8" fill="none" stroke="#FFE3A6" stroke-width="1.3" stroke-linecap="round" />
          <circle cx="7.4" cy="12" r="1.15" fill="#6B4A22" />
          <path d="M10.6 9.6q1.1 2.4 0 4.8" fill="none" stroke="#A9732A" stroke-width="1.1" stroke-linecap="round" />
        </symbol>
        <symbol id="i-shop" viewBox="0 0 24 24">
          <path d="M5 9h14l-1.1 10.4a1.8 1.8 0 0 1-1.8 1.6H7.9a1.8 1.8 0 0 1-1.8-1.6Z" fill="currentColor" />
          <path d="M8.6 9V7.4a3.4 3.4 0 0 1 6.8 0V9" fill="none" stroke="currentColor" stroke-width="2" />
          <ellipse cx="12" cy="16.4" rx="2.3" ry="1.9" fill="#fff8ee" />
          <circle cx="9.5" cy="13.6" r="0.95" fill="#fff8ee" />
          <circle cx="11.2" cy="12.5" r="0.95" fill="#fff8ee" />
          <circle cx="12.8" cy="12.5" r="0.95" fill="#fff8ee" />
          <circle cx="14.5" cy="13.6" r="0.95" fill="#fff8ee" />
        </symbol>
        <symbol id="i-floor-roof" viewBox="0 0 24 24">
          <circle cx="17" cy="6.5" r="3" fill="currentColor" />
          <path d="M2.8 18.4 10 11.6l7.2 6.8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M5.4 16.4V21h9.2v-4.6" fill="none" stroke="currentColor" stroke-width="2" />
        </symbol>
        <symbol id="i-floor-attic" viewBox="0 0 24 24">
          <path d="M3 19.5 12 5l9 14.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M5.4 19.5h13.2" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
          <circle cx="12" cy="14" r="2.5" fill="none" stroke="currentColor" stroke-width="1.8" />
        </symbol>
        <symbol id="i-floor-living" viewBox="0 0 24 24">
          <path d="M5 11V8.6A2.6 2.6 0 0 1 7.6 6h8.8A2.6 2.6 0 0 1 19 8.6V11" fill="none" stroke="currentColor" stroke-width="2" />
          <path d="M3.4 11.6a1.8 1.8 0 0 1 3.5.7V14h10.2v-1.7a1.8 1.8 0 0 1 3.5-.7V18H3.4Z" fill="currentColor" />
          <path d="M5 18v2M19 18v2" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </symbol>
        <symbol id="i-floor-high" viewBox="0 0 24 24">
          <path d="M3 20.2h7.2M8.4 14.2h7.2M13.8 8.2H21" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" />
          <path d="M6.6 16.8V11M4.2 13.2 6.6 10.8 9 13.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </symbol>
        <symbol id="i-floor-basement" viewBox="0 0 24 24">
          <path d="M3 7h5v4h4v4h4v4h5" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M15.6 4v5.4M13.2 7l2.4 2.4L18 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </symbol>
        <symbol id="i-share" viewBox="0 0 24 24">
          <path d="M12 3.5v11M7.5 8 12 3.5 16.5 8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M6 12.5v6.5a1.5 1.5 0 0 0 1.5 1.5h9a1.5 1.5 0 0 0 1.5-1.5v-6.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" />
        </symbol>
      </defs>
    </svg>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
